name: Matcha Monitor

# Runs one stock check per workflow run. Cloudflare Cron should trigger workflow_dispatch;
# the GitHub schedule below is only a best-effort backup.
on:
  schedule:
    # Backup every 15 minutes, offset from :00 because GitHub can delay/drop top-of-hour schedules under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:   # lets you trigger a run manually from the Actions tab
    inputs:
      profiles:
        description: "Comma-separated site profiles to run, e.g. koyamaen or horii,koyamaen,ippodo"
        required: false
        default: "horii,koyamaen,ippodo"
      test_telegram:
        description: "Send a test Telegram message and exit (verifies channel setup)"
        type: boolean
        default: false
      simulate_in_stock:
        description: "Pretend a product is in stock to exercise the alert path"
        type: boolean
        default: false
      debug:
        description: "More verbose logging (never prints secrets)"
        type: boolean
        default: false

# Don't let a slow run overlap with the next scheduled one.
concurrency:
  group: matcha-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the "already alerted" state from the previous run so we don't
      # re-notify the same in-stock product every cycle. Picks the most recent cache.
      - name: Restore alert state
        id: monitor-state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: matcha-alert-state-${{ github.run_id }}
          restore-keys: |
            matcha-alert-state-

      - name: Report missing monitor state
        if: steps.monitor-state.outputs.cache-matched-key == ''
        run: echo "::warning::Monitor state cache was not restored; notification history and health counters start fresh."

      - name: Run monitor (one-shot)
        env:
          RUN_ONCE: "true"
          SINGLE_INSTANCE: "false"
          # On manual runs these come from the workflow_dispatch inputs above;
          # on scheduled runs the inputs are empty, so the defaults apply.
          SITE_PROFILES: ${{ github.event.inputs.profiles || 'horii,koyamaen,ippodo' }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram || 'false' }}
          SIMULATE_IN_STOCK: ${{ github.event.inputs.simulate_in_stock || 'false' }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
          # Server has no desktop and an ephemeral cart — rely on Telegram only.
          ENABLE_LOCAL_NOTIFICATION: "false"
          AUTO_ADD_TO_CART: "false"
          ALERT_WHEN_ANY_IN_STOCK: "true"
          ALERT_ON_UNKNOWN_STOCK: "false"
          # Runner has proper CA certs, so verify TLS for both shops and Telegram.
          VERIFY_SSL: "true"
          TELEGRAM_VERIFY_SSL: "true"
          # Persisted across runs via the cache steps above/below.
          ALERT_STATE_FILE: "state/matcha_alert_state.json"
          SHIPPING_RECHECK_SECONDS: "3600"
          HEALTH_FAILURE_THRESHOLD: "3"
          HEALTH_GAP_SECONDS: "1800"
          # Optional external watchdog URL, kept secret and never logged.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # Email verification is required at each login. Never submit credentials.
          KOYAMAEN_PUBLIC_ONLY: "true"
          KOYAMAEN_ENABLE_LOGIN: "false"
          KOYAMAEN_PUBLIC_CHANGE_ALERTS: "true"
          # Secrets — set these under repo Settings > Secrets and variables > Actions.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python matcha_multi_monitor.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: matcha-alert-state-${{ github.run_id }}
